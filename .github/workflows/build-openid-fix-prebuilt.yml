name: Build ODBC Driver - OPENID Fix (Pre-built Dependencies)

on:
  push:
    branches: [ openid-only-fix ]
  pull_request:
    branches: [ openid-only-fix ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 0

    - name: Setup Git LFS
      run: git lfs pull

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~3.27.0'

    - name: Setup WiX Toolset PATH
      run: |
        # WiX is pre-installed on windows-2022 runners
        echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: Setup NASM and Perl
      run: |
        Write-Host "Installing NASM..." -ForegroundColor Yellow
        try {
          choco install nasm -y --no-progress --limit-output
          refreshenv
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "✓ NASM installed" -ForegroundColor Green
        } catch {
          Write-Host "⚠ NASM install failed, checking if already available..." -ForegroundColor Yellow
        }

        Write-Host "`nVerifying NASM..."
        $nasmPath = (Get-Command nasm -ErrorAction SilentlyContinue).Source
        if ($nasmPath) {
          Write-Host "✓ NASM found: $nasmPath" -ForegroundColor Green
          nasm --version
        } else {
          Write-Host "✗ NASM not found in PATH" -ForegroundColor Red
          exit 1
        }

        Write-Host "`nVerifying Perl..."
        $perlPath = (Get-Command perl -ErrorAction SilentlyContinue).Source
        if ($perlPath) {
          Write-Host "✓ Perl found: $perlPath" -ForegroundColor Green
          perl --version | Select-String "This is perl"
        } else {
          Write-Host "Installing Strawberry Perl..." -ForegroundColor Yellow
          choco install strawberryperl -y --no-progress --limit-output
          refreshenv
          perl --version | Select-String "This is perl"
        }
      shell: pwsh

    - name: Setup dependencies cache
      uses: actions/cache@v4
      id: deps-cache
      with:
        path: |
          D:\deps\openssl
          D:\deps\aws-sdk-cpp
          D:\deps\c-ares
          D:\deps\googletest
          D:\deps\build\aws-sdk-cpp
        key: ${{ runner.os }}-redshift-deps-v3-${{ hashFiles('.github/workflows/build-openid-fix-prebuilt.yml') }}
        restore-keys: |
          ${{ runner.os }}-redshift-deps-v3-
          ${{ runner.os }}-redshift-deps-

    - name: Download and build dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: |
        # Create dependencies directory
        New-Item -ItemType Directory -Force -Path "D:\deps"
        New-Item -ItemType Directory -Force -Path "D:\deps\build"

        # Download OpenSSL 1.1.1w pre-built binaries
        Write-Host "Downloading OpenSSL..."
        $opensslUrl = "https://slproweb.com/download/Win64OpenSSL-1_1_1w.exe"
        $opensslInstaller = "D:\deps\openssl-installer.exe"
        Invoke-WebRequest -Uri $opensslUrl -OutFile $opensslInstaller

        # Install OpenSSL silently
        Write-Host "Installing OpenSSL..."
        Start-Process -FilePath $opensslInstaller -ArgumentList "/VERYSILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=D:\deps\openssl" -Wait -NoNewWindow

        # Download and build AWS SDK C++
        Write-Host "Downloading AWS SDK C++..."
        git clone --depth 1 --branch 1.11.743 https://github.com/aws/aws-sdk-cpp.git D:\deps\build\aws-sdk-cpp

        New-Item -ItemType Directory -Force -Path "D:\deps\build\aws-sdk-cpp-build"
        cd D:\deps\build\aws-sdk-cpp-build

        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="D:\deps\aws-sdk-cpp" `
          -DBUILD_ONLY="core;redshift;sts;identity-management" `
          -DENABLE_TESTING=OFF `
          -DBUILD_SHARED_LIBS=OFF `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
          D:\deps\build\aws-sdk-cpp

        cmake --build . --config Release --target install -j 4

        # Download and build c-ares
        Write-Host "Downloading c-ares..."
        git clone --depth 1 --branch v1.34.5 https://github.com/c-ares/c-ares.git D:\deps\build\c-ares

        New-Item -ItemType Directory -Force -Path "D:\deps\build\c-ares-build"
        cd D:\deps\build\c-ares-build

        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="D:\deps\c-ares" `
          -DCARES_STATIC=ON `
          -DCARES_SHARED=OFF `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
          D:\deps\build\c-ares

        cmake --build . --config Release --target install -j 4

        # Download and build GoogleTest
        Write-Host "Downloading GoogleTest..."
        git clone --depth 1 --branch v1.17.0 https://github.com/google/googletest.git D:\deps\build\googletest

        New-Item -ItemType Directory -Force -Path "D:\deps\build\googletest-build"
        cd D:\deps\build\googletest-build

        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="D:\deps\googletest" `
          -DBUILD_SHARED_LIBS=OFF `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
          D:\deps\build\googletest

        cmake --build . --config Release --target install -j 4

        Write-Host "Dependencies built successfully!"

      shell: pwsh

    - name: Verify dependencies structure
      run: |
        Write-Host "=== Dependencies Structure ==="
        tree /F D:\deps | Select-Object -First 50

        Write-Host "`n=== OpenSSL ==="
        if (Test-Path "D:\deps\openssl") {
          Get-ChildItem -Path "D:\deps\openssl" -Recurse | Select-Object -First 20
        }

        Write-Host "`n=== AWS SDK ==="
        if (Test-Path "D:\deps\aws-sdk-cpp") {
          Get-ChildItem -Path "D:\deps\aws-sdk-cpp" -Recurse | Select-Object -First 20
        }
      shell: pwsh

    - name: Read version
      id: version
      run: |
        $version = (Get-Content version.txt).Trim()
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Build ODBC Driver
      run: |
        # Create exports_basic.bat for build script
        @"
        set ENABLE_TESTING=0
        set "RS_MULTI_DEPS_DIRS=D:\deps"
        set "RS_OPENSSL_DIR=D:\deps\openssl"
        "@ | Out-File -FilePath "exports_basic.bat" -Encoding ASCII

        # Debug: Show what we created
        Write-Host "=== exports_basic.bat content ==="
        Get-Content exports_basic.bat

        # Debug: Show dependencies structure
        Write-Host "`n=== D:\deps structure ==="
        Get-ChildItem -Path "D:\deps" -Recurse -Depth 2 | Select-Object FullName

        # Run build
        .\build64.bat --dependencies-install-dir=D:\deps --version=${{ steps.version.outputs.VERSION }}
      shell: pwsh

    - name: List build outputs
      if: always()
      run: |
        echo "=== DLL Output ==="
        if (Test-Path "cmake-build\install\lib") {
          Get-ChildItem -Path "cmake-build\install\lib" -Filter "*.dll" -Recurse
        } else {
          Write-Host "DLL directory not found"
        }
        echo ""
        echo "=== MSI Output ==="
        if (Test-Path "src\odbc\rsodbc\install") {
          Get-ChildItem -Path "src\odbc\rsodbc\install" -Filter "*.msi" -Recurse
        } else {
          Write-Host "MSI directory not found"
        }
      shell: pwsh

    - name: Generate checksums
      run: |
        $msiPath = Get-ChildItem -Path "src\odbc\rsodbc\install" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($msiPath) {
          $hash = (Get-FileHash -Path $msiPath.FullName -Algorithm SHA256).Hash
          $hashFile = "$($msiPath.FullName).sha256"
          "$hash  $($msiPath.Name)" | Out-File -FilePath $hashFile -Encoding ASCII
          echo "SHA256: $hash"
        } else {
          Write-Host "No MSI found to hash"
        }
      shell: pwsh

    - name: Upload MSI Installer
      uses: actions/upload-artifact@v4
      with:
        name: redshift-odbc-openid-fix-v${{ steps.version.outputs.VERSION }}
        path: |
          src/odbc/rsodbc/install/*.msi
          src/odbc/rsodbc/install/*.msi.sha256
        retention-days: 90

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: redshift-odbc-dll-v${{ steps.version.outputs.VERSION }}
        path: cmake-build/install/lib/*.dll
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          cmake-build/**/*.log
          *.log
        retention-days: 7
        if-no-files-found: ignore

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/openid-only-fix'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Read version
      id: version
      run: |
        VERSION=$(cat version.txt | tr -d ' ')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: redshift-odbc-openid-fix-v${{ steps.version.outputs.VERSION }}
        path: ./artifacts

    - name: Create Release Notes
      run: |
        cat > RELEASE_NOTES.md << 'EOF'
        # Amazon Redshift ODBC Driver - OPENID Fix v${{ steps.version.outputs.VERSION }}

        ## 🎯 What's Fixed

        This release contains a **single, isolated fix**: Auto-add `openid` scope in Azure OAuth2 authentication.

        ### The Issue
        When using Browser Azure AD OAuth2 authentication, the driver was not automatically adding the `openid` scope, causing authentication failures:
        ```
        AADSTS65001: The user or administrator has not consented to use the application
        ```

        ### The Fix
        - ✅ Automatically adds `openid` to scope if not already present
        - ✅ Smart detection prevents duplication
        - ✅ Matches JDBC driver behavior
        - ✅ Improved debug logging

        ## 📦 What's Included

        - `AmazonRedshiftODBC64_${{ steps.version.outputs.VERSION }}.msi` - MSI Installer
        - `AmazonRedshiftODBC64_${{ steps.version.outputs.VERSION }}.msi.sha256` - Checksum

        ## 🔧 Installation

        1. Download the MSI file
        2. Verify checksum (optional)
        3. Run: `msiexec /i AmazonRedshiftODBC64_${{ steps.version.outputs.VERSION }}.msi`
        4. Configure ODBC DSN with Azure OAuth2
        5. Test connection

        ## ✅ Usage

        **You no longer need to specify `openid` in the scope!**

        ```ini
        # ✅ This works now (openid added automatically)
        scope=api://YOUR-APP-ID/jdbc_login

        # ✅ This also works (no duplication)
        scope=openid api://YOUR-APP-ID/jdbc_login
        ```

        ## 📊 Changes

        - **Files changed:** 1
        - **Lines added:** 24
        - **Lines removed:** 2
        - **Backward compatible:** 100%
        - **Breaking changes:** 0

        ## 🔍 Verification

        Enable logging and check for:
        ```
        [DEBUG] RequestAuthorizationCode: Added 'openid' to scope
        [DEBUG] Added 'openid' prefix to scope. Final scope: openid api://...
        ```

        ## 📝 Based On

        - **AWS Redshift ODBC:** v2.1.13 (Official)
        - **Build Method:** Pre-built dependencies (AWS approach)
        - **Dependencies:**
          - OpenSSL 1.1.1w
          - AWS SDK C++ 1.11.743
          - C-ares 1.34.5
          - GoogleTest 1.17.0
        - **Branch:** openid-only-fix

        ---

        **Built with GitHub Actions**
        **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}-openid-fix
        name: ODBC Driver v${{ steps.version.outputs.VERSION }} - OPENID Fix
        body_path: RELEASE_NOTES.md
        files: |
          artifacts/*.msi
          artifacts/*.sha256
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
