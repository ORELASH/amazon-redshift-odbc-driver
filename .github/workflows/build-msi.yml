name: Build Redshift ODBC MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-msi:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install Perl (for OpenSSL)
        run: |
          choco install strawberryperl -y
          echo "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}-v2
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install dependencies with vcpkg (with retries)
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryCount = 0
          $success = $false

          # Install OpenSSL 3.3.2 and other dependencies
          $packages = @(
            "openssl:x64-windows",
            "aws-sdk-cpp[core,redshift,redshift-serverless,sts,sso-oidc]:x64-windows",
            "zlib:x64-windows",
            "curl:x64-windows"
          )

          while (-not $success -and $retryCount -lt $maxRetries) {
            try {
              Write-Host "Installing vcpkg packages (attempt $($retryCount + 1)/$maxRetries)..."

              foreach ($package in $packages) {
                Write-Host "Installing $package..."
                & "$env:VCPKG_ROOT\vcpkg.exe" install $package --triplet x64-windows
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install $package"
                }
              }

              $success = $true
              Write-Host "All packages installed successfully"
            }
            catch {
              $retryCount++
              if ($retryCount -lt $maxRetries) {
                Write-Host "Installation failed, retrying in 10 seconds... (attempt $retryCount/$maxRetries)"
                Start-Sleep -Seconds 10
              }
              else {
                Write-Host "Failed after $maxRetries attempts"
                throw
              }
            }
          }

      - name: Verify vcpkg installation
        shell: pwsh
        run: |
          $vcpkgInstalled = "$env:VCPKG_ROOT\installed\x64-windows"
          Write-Host "Checking vcpkg installation at: $vcpkgInstalled"

          if (Test-Path "$vcpkgInstalled\include\openssl\ssl.h") {
            Write-Host "OpenSSL headers found"
            Get-Content "$vcpkgInstalled\include\openssl\opensslv.h" | Select-String "OPENSSL_VERSION_TEXT"
          } else {
            Write-Error "OpenSSL headers not found!"
            exit 1
          }

          if (Test-Path "$vcpkgInstalled\lib\libssl.lib") {
            Write-Host "OpenSSL libraries found"
          } else {
            Write-Error "OpenSSL libraries not found!"
            exit 1
          }

      - name: Get driver version
        id: version
        shell: pwsh
        run: |
          $versionContent = Get-Content version.txt -Raw
          $version = $versionContent.Trim() -replace '\s+', '.'
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Driver version: $version"

      - name: Build ODBC Driver with MSI
        shell: cmd
        run: |
          set "VCPKG_INSTALL_DIR=%VCPKG_ROOT%\installed\x64-windows"
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          echo Building driver with OpenSSL from vcpkg...
          build64.bat --dependencies-install-dir=%VCPKG_INSTALL_DIR% --version=${{ steps.version.outputs.VERSION }}

      - name: Find MSI file
        id: find_msi
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem -Path . -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          if ($msiFiles.Count -eq 0) {
            Write-Error "No MSI file found!"
            exit 1
          }

          $msiPath = $msiFiles[0].FullName
          Write-Host "Found MSI: $msiPath"
          echo "MSI_PATH=$msiPath" >> $env:GITHUB_OUTPUT

      - name: Calculate SHA256
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "${{ steps.find_msi.outputs.MSI_PATH }}" -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedshiftODBC-${{ steps.version.outputs.VERSION }}-msi
          path: ${{ steps.find_msi.outputs.MSI_PATH }}
          retention-days: 90

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_msi.outputs.MSI_PATH }}
          body: |
            ## Redshift ODBC Driver ${{ steps.version.outputs.VERSION }}

            **OpenSSL Version:** 3.3.2

            ### Changes
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)

            ### SHA256
            ```
            ${{ steps.sha256.outputs.SHA256 }}  ${{ steps.find_msi.outputs.MSI_PATH }}
            ```

            ### Build Information
            - Built with vcpkg
            - WiX Toolset 5.0.2
            - Visual Studio 2022
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        shell: pwsh
        run: |
          Write-Host "=== Build Summary ==="
          Write-Host "Version: ${{ steps.version.outputs.VERSION }}"
          Write-Host "MSI Path: ${{ steps.find_msi.outputs.MSI_PATH }}"
          Write-Host "SHA256: ${{ steps.sha256.outputs.SHA256 }}"
          Write-Host "OpenSSL: 3.3.2 (from vcpkg)"
